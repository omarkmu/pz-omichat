name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-translations:
    name: Translation check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout pz-utils
        uses: actions/checkout@v4
        with:
          repository: omarkmu/pz-utils
          path: pz-utils
      - name: Set up Node
        uses: actions/setup-node@v6
      - name: Install pz-utils
        run: npm install ./pz-utils
      - name: Run analyzer
        run: |
          cd pz-utils
          npm run analyze -- .. --ignore missing-file
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua
        # see https://github.com/leafo/gh-actions-lua/issues/57
        uses: lewis6991/gh-actions-lua@01aab24c4de9555717b685f9b142a2abbe12ef14
        with: 
          luaVersion: '5.2'
      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4
        with:
          luaRocksVersion: "3.12.0"
      - name: Install mdbook
        run: |
          tag=$(curl 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir mdbook
          curl -sSL $url | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH
      - name: Build documentation
        run: ./scripts/build-docs
